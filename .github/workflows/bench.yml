name: bench

on:
  workflow_dispatch:
    inputs:
      version:
        description: voila release tag to benchmark
        default: v0.1.0-alpha.5
      voila_ref:
        description: build voila from this branch or commit instead of installing the release
        default: ""
      quick:
        description: one cold run, skip the large image
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # Mondays

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install voila (the published release, via install.sh)
        env:
          VERSION: ${{ inputs.version || 'v0.1.0-alpha.5' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL https://github.com/voilabuild/voila/raw/main/install.sh | sh -s -- --version "$VERSION" --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check out voila (voila_ref)
        if: inputs.voila_ref != ''
        uses: actions/checkout@v4
        with:
          repository: voilabuild/voila
          ref: ${{ inputs.voila_ref }}
          path: voila-src

      - uses: mlugg/setup-zig@v2
        if: inputs.voila_ref != ''
        with:
          version: 0.17.0

      - name: Build voila (voila_ref) over the release
        if: inputs.voila_ref != ''
        working-directory: voila-src
        run: |
          zig build -Doptimize=ReleaseSafe
          install -m 0755 zig-out/bin/voila "$HOME/.local/bin/voila"

      - name: Benchmark
        env:
          VOILA_REGISTRY_TOKEN: ${{ secrets.VOILA_REGISTRY_TOKEN }}
        run: |
          voila --version
          if [ "${{ inputs.quick }}" = true ]; then args="--quick --reps 1 --warm-reps 3"; else args="--reps 3 --warm-reps 10"; fi
          python3 -I bench.py $args --trace-dir traces --out results
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trace summaries
        if: inputs.voila_ref != ''
        run: |
          for f in traces/*.json; do
            [ -s "$f" ] || continue
            { echo "## Trace: $(basename "$f" .json) (cold, one run)"; echo '```'; python3 -I voila-src/tools/trace_summary.py "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results.*
            traces/

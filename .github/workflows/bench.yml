name: bench

on:
  workflow_dispatch:
    inputs:
      version:
        description: voila release tag to benchmark
        default: v0.1.0-alpha.5
      voila_ref:
        description: build voila from this branch or commit instead of installing the release
        default: ""
      baseline_ref:
        description: with voila_ref, also build this ref and alternate the two in one job
        default: ""
      suite:
        description: "micro: cold/warm python print(1); ci: build and test jobs (Go, Python, Node); services: time to a ready postgres, redis, Next.js app"
        type: choice
        options: [micro, ci, services]
        default: micro
      reps:
        description: cold-start repetitions per image
        default: "3"
      prefetch_dirs:
        description: "ci and services suites: also run voila with --prefetch-dirs (needs a voila_ref that has it)"
        type: boolean
        default: false
      quick:
        description: one cold run, skip the large image
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # Mondays

# One group per suite: GitHub keeps one pending run per group and cancels the rest,
# so suites dispatched together would cancel each other. Each run has its own VM.
concurrency:
  group: bench-${{ inputs.suite || 'micro' }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install voila (the published release, via install.sh)
        env:
          VERSION: ${{ inputs.version || 'v0.1.0-alpha.5' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL https://github.com/voilabuild/voila/raw/main/install.sh | sh -s -- --version "$VERSION" --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check out voila (voila_ref)
        if: inputs.voila_ref != ''
        uses: actions/checkout@v4
        with:
          repository: voilabuild/voila
          ref: ${{ inputs.voila_ref }}
          path: voila-src

      - uses: mlugg/setup-zig@v2
        if: inputs.voila_ref != ''
        with:
          version: 0.17.0

      - name: Build voila (voila_ref) over the release
        if: inputs.voila_ref != ''
        working-directory: voila-src
        run: |
          zig build -Doptimize=ReleaseSafe
          dst=$(command -v voila)
          echo "replacing $dst"
          sudo install -m 0755 zig-out/bin/voila "$dst"
          voila --version

      - name: Build baseline (baseline_ref)
        if: inputs.baseline_ref != ''
        run: |
          git -C voila-src fetch -q origin "${{ inputs.baseline_ref }}"
          git -C voila-src worktree add -q ../voila-base FETCH_HEAD
          (cd voila-base && zig build -Doptimize=ReleaseSafe)
          dir=$(dirname "$(command -v voila)")
          sudo install -m 0755 voila-base/zig-out/bin/voila "$dir/voila-base"
          # AppArmor is off for user namespaces on the runner (sysctl above), so any path works.

      - name: Benchmark
        env:
          VOILA_REGISTRY_TOKEN: ${{ secrets.VOILA_REGISTRY_TOKEN }}
        run: |
          voila --version
          if [ "${{ inputs.quick }}" = true ]; then args="--quick --reps 1 --warm-reps 3"; else args="--reps ${{ inputs.reps || 3 }} --warm-reps 10"; fi
          ci_args=""
          if [ "${{ inputs.prefetch_dirs }}" = true ]; then ci_args="--prefetch-dirs"; fi
          if [ "${{ inputs.suite }}" = services ]; then
            # Building the app is setup, not timed: both sides serve the same build.
            (cd workloads/nextjs && npm ci --no-audit --no-fund && npx next build)
            python3 -I services.py --reps "${{ inputs.reps || 3 }}" $ci_args --trace-dir traces --out results
          elif [ "${{ inputs.suite }}" = ci ]; then
            python3 -I ci.py --reps "${{ inputs.reps || 3 }}" $ci_args --trace-dir traces --out results
          else
            if [ -n "${{ inputs.baseline_ref }}" ]; then args="$args --compare $(command -v voila-base)"; fi
            python3 -I bench.py $args --trace-dir traces --out results
          fi
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trace summaries
        if: inputs.voila_ref != ''
        run: |
          pattern='traces/*.json'
          # A/B mode writes a trace per run; summarize the first (prime) run of each image.
          if [ -n "${{ inputs.baseline_ref }}" ]; then pattern='traces/*-00-new.json'; fi
          # The ci suite traces every voila run; summarize the first, the coldest.
          if [ "${{ inputs.suite }}" = ci ]; then pattern='traces/ci-*-1.json'; fi
          if [ "${{ inputs.suite }}" = services ]; then pattern='traces/svc-*-1.json'; fi
          for f in $pattern; do
            [ -s "$f" ] || continue
            { echo "## Trace: $(basename "$f" .json) (cold, one run)"; echo '```'; python3 -I voila-src/tools/trace_summary.py "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results.*
            traces/
